  <svg
  class="interior-hero-pattern"
  viewBox="0 0 320 512"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <pattern
      id="starPattern"
      patternUnits="userSpaceOnUse"
      width="34"
      height="34"
    >
      <!-- 
        The PNG is natively 64×64.
        We scale it down explicitly.
      -->
      <image
        href="data:image/png;base64,"
        width="64"
        height="64"
        transform="scale(0.53)"
      />
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="url(#starPattern)" />
</svg>